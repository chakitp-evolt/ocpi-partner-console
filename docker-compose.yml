# Local development only. The console initializes the database on startup.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: partner_console
      POSTGRES_USER: partner_console
      POSTGRES_PASSWORD: partner_console
    ports:
      - "55432:5432"
    volumes:
      - partner_console_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partner_console -d partner_console"]
      interval: 2s
      timeout: 3s
      retries: 20

  console:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://partner_console:partner_console@postgres:5432/partner_console?sslmode=disable
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-local-development-only-change-me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      EVOLT_VERSIONS_URL: ${EVOLT_VERSIONS_URL:-http://bff-external-service.dev.evtech.dev/api/ocpi/versions}
    ports:
      - "8080:8080"

volumes:
  partner_console_db:
